data_path: data/raw/transactions.csv

database:
  host: localhost
  port: 5432
  db: banking
  user: postgres
  password: root

paths:
  raw: data/raw
  bronze: data/processed/bronze
  bronze_stream: data/processed/bronze_stream
  silver: data/processed/silver
  enriched: data/processed/enriched
  gold: data/processed/gold
  warehouse: data/warehouse

engine: spark

spark:
  app_name: financial_fraud_analytics
  master: local[*]
  shuffle_partitions: 4
  output_files_per_partition: 1
  # Kafka connector for structured streaming (pulled from Maven on first run)
  jars_packages: org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1

kafka:
  bootstrap_servers: localhost:9092
  topic: transactions
  client_id: ffa-producer
  starting_offsets: earliest
  throttle_ms: 0          # delay between messages to simulate real-time (0 = max speed)

streaming:
  checkpoint_path: data/checkpoints/bronze_stream
  trigger_seconds: 5
  max_offsets_per_trigger: 10000

bronze:
  format: parquet
  compression: snappy
  partition_cols:
    - dt

silver:
  format: parquet
  compression: snappy
  partition_cols:
    - dt

gold:
  compression: snappy

loading:
  table: fact_transactions
  if_exists: replace