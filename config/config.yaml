data_path: data/raw/transactions.csv

database:
  host: localhost
  port: 5432
  db: banking
  user: postgres
  password: root

paths:
  raw: data/raw
  bronze: data/processed/bronze
  silver: data/processed/silver
  gold: data/processed/gold
  warehouse: data/warehouse

bronze:
  format: parquet
  compression: snappy
  partition_cols:
    - dt

silver:
  format: parquet
  compression: snappy
  partition_cols:
    - dt

loading:
  table: fact_transactions
  if_exists: replace